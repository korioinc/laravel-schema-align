name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag without a v prefix (for example 1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
      tag_object: ${{ steps.verify.outputs.tag_object }}

    steps:
      - name: Checkout the default branch and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the existing release tag
        id: verify
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use an existing stable SemVer tag without a v prefix, such as 1.0.1."
            exit 1
          fi
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          tag_object="$(git rev-parse --verify "refs/tags/$TAG")"
          if ! git merge-base --is-ancestor "$commit" HEAD; then
            echo "::error::The release tag must belong to the default branch history."
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\ntag_object=%s\n' "$TAG" "$commit" "$tag_object" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_body: ${{ steps.publish.outputs.release_body }}

    steps:
      - name: Publish the verified tag or reuse its existing release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.prepare.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$actual" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "::error::The release tag changed after verification. Refusing to publish."
            exit 1
          fi
          if gh release view "$TAG" --json tagName,isDraft,isPrerelease,body > release.json; then
            if ! jq -e --arg tag "$TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false' release.json > /dev/null; then
              echo "::error::An existing draft or prerelease is not modified by this workflow."
              exit 1
            fi
            echo "Reusing the existing release without modifying it."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
            gh release view "$TAG" --json body > release.json
          fi
          delimiter="$(openssl rand -hex 16)"
          {
            printf 'release_body<<%s\n' "$delimiter"
            jq -r '.body // ""' release.json
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

  changelog:
    needs: [prepare, publish]
    uses: ./.github/workflows/update-changelog.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
      release_body: ${{ needs.publish.outputs.release_body }}
    permissions:
      contents: write
