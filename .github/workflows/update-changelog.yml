name: Update Changelog

on:
  release:
    types: [released]
  workflow_call:
    inputs:
      release_tag:
        description: Published release tag
        required: true
        type: string
      release_body:
        description: Published release notes
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: changelog-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check whether the release is already in the changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = re.escape(os.environ['RELEASE_TAG'])
          heading = re.compile(r'^##\s+(?:\[' + tag + r'\](?:\([^\n]*\))?|' + tag + r')(?:\s|$)', re.MULTILINE)
          exists = heading.search(Path('CHANGELOG.md').read_text()) is not None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'exists={str(exists).lower()}\n')
          PY

      - name: Update changelog
        if: steps.changelog.outputs.exists != 'true'
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ inputs.release_tag || github.event.release.tag_name }}
          release-notes: ${{ inputs.release_body || github.event.release.body || 'Release notes not provided' }}
          compare-url-target-revision: ${{ github.event.repository.default_branch }}

      - name: Commit updated changelog
        if: steps.changelog.outputs.exists != 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          branch: ${{ github.event.repository.default_branch }}
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
